name: Deploy Content Platform to CapRover

on:
  push:
    branches:
      - main
    paths:
      - "backend-nestjs/**"
      - "frontend/admin-mfe/**"
      - "frontend/demo-next/**"
      - "captain-definition"
      - ".github/workflows/deploy-cms.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed apps
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "cms=true" >> "$GITHUB_OUTPUT"
            echo "demo=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            changed_files="$(git diff-tree --no-commit-id --name-only -r "${{ github.sha }}")"
          else
            changed_files="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
          fi

          if echo "$changed_files" | grep -Eq '^(backend-nestjs/|captain-definition$|\.github/workflows/deploy-cms\.yml$)'; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$changed_files" | grep -Eq '^(frontend/admin-mfe/|\.github/workflows/deploy-cms\.yml$)'; then
            echo "cms=true" >> "$GITHUB_OUTPUT"
          else
            echo "cms=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$changed_files" | grep -Eq '^(frontend/demo-next/|\.github/workflows/deploy-cms\.yml$)'; then
            echo "demo=true" >> "$GITHUB_OUTPUT"
          else
            echo "demo=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install CapRover CLI
        run: npm install -g caprover

      - name: Deploy Content Platform API
        if: steps.changes.outputs.api == 'true'
        run: |
          tar -czf contentplatform-api.tar.gz captain-definition backend-nestjs
          caprover deploy \
            --caproverUrl "${{ secrets.CAPROVER_URL }}" \
            --caproverPassword "${{ secrets.CAPROVER_PASSWORD }}" \
            --appName "content-platform-api" \
            --tarFile contentplatform-api.tar.gz

      - name: Deploy CMS
        if: steps.changes.outputs.cms == 'true'
        run: |
          tar -czf cms.tar.gz -C frontend/admin-mfe .
          caprover deploy \
            --caproverUrl "${{ secrets.CAPROVER_URL }}" \
            --caproverPassword "${{ secrets.CAPROVER_PASSWORD }}" \
            --appName "cms" \
            --tarFile cms.tar.gz

      - name: Deploy Live Demo
        if: steps.changes.outputs.demo == 'true'
        run: |
          tar -czf demo.tar.gz -C frontend/demo-next .
          caprover deploy \
            --caproverUrl "${{ secrets.CAPROVER_URL }}" \
            --caproverPassword "${{ secrets.CAPROVER_PASSWORD }}" \
            --appName "content-platform-demo" \
            --tarFile demo.tar.gz
