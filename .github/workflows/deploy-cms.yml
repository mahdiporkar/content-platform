name: Deploy CMS to CapRover

on:
  push:
    branches:
      - main
    paths:
      - "frontend/admin-mfe/**"
      - ".github/workflows/deploy-cms.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install CapRover CLI
        run: npm install -g caprover

      - name: Deploy CMS
        working-directory: frontend/admin-mfe
        run: |
          caprover deploy \
            --caproverUrl "${{ secrets.CAPROVER_URL }}" \
            --caproverPassword "${{ secrets.CAPROVER_PASSWORD }}" \
            --appName "cms"