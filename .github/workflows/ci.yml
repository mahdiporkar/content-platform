name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  demo:
    name: Demo production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/demo-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/demo-next/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    name: NestJS tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-nestjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend-nestjs/package-lock.json
      - run: npm ci
      - run: npm test -- --runInBand

