name: Bug report
description: Report a reproducible problem in Content Platform
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Content Platform. Do not include secrets, tokens, or personal data.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options: [Backend API, Admin Studio, Consumer Demo, Media storage, Deployment, Documentation]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: "1. Open…\n2. Select…\n3. Observe…"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: main / commit SHA / release
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Node.js and Docker versions, as applicable.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed credentials and sensitive information.
          required: true

