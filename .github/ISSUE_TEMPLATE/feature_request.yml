name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user or operational problem, not only the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: scope
    attributes:
      label: Primary scope
      options: [Content modeling, Editorial workflow, Delivery API, Media, Multi-tenancy, Security, Analytics, Developer experience, Documentation]
    validations:
      required: true

